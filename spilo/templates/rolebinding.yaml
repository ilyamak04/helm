apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "spilo.serviceAccountName" . }}
  labels:
    {{- include "spilo.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "spilo.serviceAccountName" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "spilo.serviceAccountName" . }}