# Default values for gitflic.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.


# Тип развертывания зависит от того, какой volume используется при работе
# с контейнером.
# Если volume типа ReadWriteMany - Deployment
# Если volume типа ReadWriteOnce - StatefulSet
type: StatefulSet
# В случе type: StatefulSet replicaCount всегда = 1
replicaCount: 1

# image:
#   repository: 
#   pullPolicy: 
#   # Overrides the image tag whose default is the chart appVersion.
#   tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# Данный сервис необходим только для StatefulSet
serviceHeadless:
  port: 80

# Service types: NodePort, LoadBalancer
serviceSSH:
  enable: false
  type: NodePort
  port: 2022
  nodePort: ""
  # Пример конфигурации сервиса типа LoadBalancer MetalLB
  annotations: {}
  #  metallb.universe.tf/loadBalancerIPs: 192.168.1.100

# Service types: ClusterIP, NodePort, LoadBalancer
service:
  type: ClusterIP
  port: 80
  nodePort: ""
  # Пример конфигурации сервиса типа LoadBalancer MetalLB
  annotations: {}
  #  metallb.universe.tf/loadBalancerIPs: 192.168.1.100


redis:
  builtin: true
  # Конфигурация внешнего Redis
  externalRedis:
    host: "192.168.0.1"
    port: "6379"
    # user: "gitflic"
    user: ""
    # password: "passw0rd"
    password: ""
    # database: "0"
    database: ""
    ssl: false
  # Конфигурация встроенного Redis
  global:
    storageClass: ""
  auth:
    enabled: false
    password: "PASSW0RD"
  master:
    count: 1
    persistence:
      enabled: true
      storageClass: ""
      size: 1Gi
  replica:
    replicaCount: 1
    persistence:
      enabled: true
      storageClass: ""
      size: 1Gi
  volumePermissions:
    enabled: true

postgresql:
  builtin: true
  # Общие параметры.
  postgresDBName: "gitflic"
  postgresUser: "gitflic"
  # Secret создаваемый в ручную.
  # ---
  # apiVersion: v1
  # kind: Secret
  # metadata:
  #   name: secretName
  # type: Opaque
  # stringData:
  #   postgres-user-password: password
  # ...
  # Если имя секрета определеноЮ пароль берется из этого сикрета
  secretName: ""
  # Если Secret не определён, и пароль явно не задан в следующем параметре,
  # Secret с паролем генерируется автоматически.
  postgresPassword: ""
  # Параметры внешней базы данных.
  externalDB:
    postgresHost: "192.168.0.1"
    postgresPort: "5432"
  # Параметры встроенной базы данных.
  jobInitDB:
    image: postgres
    tag: 18.3-alpine3.23
    imagePullPolicy: IfNotPresent
  global:
    storageClass: ""
  clusterDomain: "cluster.local"
  image:
    tag: 18.3-bookworm
  auth:
    postgresPassword: "password"
  architecture: replication
  shmVolume:
    sizeLimit: "1Gi"
  primary:
    resources:
      limits:
        memory: "1Gi"
        cpu: "1000m"
      requests:
        memory: "1Gi"
        cpu: "1000m"
    persistence:
      enabled: true
      storageClass: ""
      size: "1Gi"
  readReplicas:
    resources:
      limits:
        memory: "1Gi"
        cpu: "1000m"
      requests:
        memory: "1Gi"
        cpu: "1000m"
    persistence:
      enabled: true
      storageClass: ""
      size: "1Gi"