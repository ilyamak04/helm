apiVersion: v2
name: gitflic
description: A Gitflic Helm chart for Kubernetes (по видео Артура Крюкова)
type: application
version: 0.1.0
appVersion: "2.16.1"
maintainers:
  - name: Ilya Makarov
dependencies:
  - name: redis
    version: 25.3.2
    repository: https://charts.bitnami.com/bitnami
    condition: redis.builtin
  - name: postgresql
    version: 18.5.2
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.builtin